<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascotas · Clínica Veterinaria "Patitas Felices"</title>
    <!-- Bootstrap 5 por CDN: no se instala nada con npm.
         integrity = huella del archivo: si el CDN sirviera un archivo distinto, el
         navegador lo descarta en lugar de ejecutarlo. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<!-- ===== Barra de navegación (igual en las cuatro páginas) ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🐾 Clínica Veterinaria "Patitas Felices"</span>
        <div class="navbar-nav">
            <a class="nav-link" href="index.html">Dueños</a>
            <a class="nav-link active" href="mascotas.html">Mascotas</a>
            <a class="nav-link" href="veterinarios.html">Veterinarios</a>
            <a class="nav-link" href="turnos.html">Turnos</a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Mascotas de la clínica</h2>
        <button class="btn btn-primary" id="botonNuevo">+ Nueva mascota</button>
    </div>

    <!-- Avisos de la página: acá se muestran los errores que no vienen del formulario
         (por ejemplo, un error al eliminar, que ocurre con el modal cerrado) -->
    <div id="aviso" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover bg-white">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Fecha de nacimiento</th>
                <th>Dueño</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <p id="sinDatos" class="text-muted d-none">Todavía no hay mascotas registradas.</p>

</div>

<!-- ===== Modal de alta / edición (el mismo formulario sirve para las dos cosas) ===== -->
<div class="modal fade" id="modalFormulario" tabindex="-1">
    <div class="modal-dialog">
        <!-- novalidate: desactiva la validación del navegador para que se vean los
             mensajes de error que devuelve la API (así se prueba el backend de verdad) -->
        <form class="modal-content" id="formulario" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nueva mascota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="errorFormulario" class="alert alert-danger d-none"></div>

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="especie">Especie</label>
                    <input class="form-control" id="especie" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="raza">Raza</label>
                    <input class="form-control" id="raza" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                    <input class="form-control" id="fechaNacimiento" type="date">
                    <div class="form-text" id="ayudaFechaNacimiento">No puede ser una fecha futura.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="duenioId">Dueño</label>
                    <select class="form-select" id="duenioId">
                        <option value="">Elegí un dueño...</option>
                    </select>
                    <!-- En edición este campo se bloquea: el backend no cambia el dueño
                         de una mascota, pero el valor igual se envía porque el DTO lo valida -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    // ==========================================================================
    //  Mascotas — consumo de la API REST con fetch
    //  La API corre en el puerto 8080 y esta página en el 5500: son orígenes
    //  distintos, así que el navegador exige el permiso CORS que da CorsConfig.
    // ==========================================================================
    const URL_API = "http://localhost:8080/api/mascotas";
    const URL_DUENIOS = "http://localhost:8080/api/duenios";

    // Guarda el id de la mascota que se está editando. Si vale null, el formulario es un alta.
    let idEnEdicion = null;
    let modal = null;

    // --------------------------------------------------------------------------
    //  Único lugar donde se llama a la API. Devuelve el JSON ya parseado y, si la
    //  respuesta es un error, lanza una excepción con el mensaje que manda el backend.
    // --------------------------------------------------------------------------
    async function pedir(url, opciones) {
        let respuesta;
        try {
            respuesta = await fetch(url, opciones);
        } catch (error) {
            // Acá cae la falta de conexión y el bloqueo por CORS
            throw new Error("No se pudo conectar con la API. ¿Está corriendo en el puerto 8080?");
        }

        // El 204 (No Content) del DELETE no trae cuerpo: no se puede leer como JSON
        if (respuesta.status === 204) {
            return null;
        }

        let cuerpo = null;
        try {
            cuerpo = await respuesta.json();
        } catch (error) {
            cuerpo = null;
        }

        if (!respuesta.ok) {
            // El backend responde siempre un ErrorResponse, y su campo se llama "mensaje"
            if (cuerpo !== null && cuerpo.mensaje) {
                throw new Error(cuerpo.mensaje);
            }
            throw new Error("El servidor respondió con el estado " + respuesta.status);
        }
        return cuerpo;
    }

    // --------------------------------------------------------------------------
    //  Tabla
    // --------------------------------------------------------------------------
    async function cargarTabla() {
        const cuerpoTabla = document.getElementById("cuerpoTabla");
        cuerpoTabla.innerHTML = "";
        try {
            const mascotas = await pedir(URL_API);
            for (const mascota of mascotas) {
                agregarFila(mascota);
            }
            mostrarSinDatos(mascotas.length === 0);
        } catch (error) {
            mostrarAviso(error.message);
        }
    }

    function agregarFila(mascota) {
        const fila = document.createElement("tr");

        // textContent (en vez de innerHTML) evita que un dato con < o > rompa la página
        agregarCelda(fila, mascota.id);
        agregarCelda(fila, mascota.nombre);
        agregarCelda(fila, mascota.especie);
        agregarCelda(fila, mascota.raza);
        agregarCelda(fila, mascota.fechaNacimiento);
        agregarCelda(fila, mascota.duenioNombre);

        const celdaAcciones = document.createElement("td");
        celdaAcciones.className = "text-end";

        const botonEditar = document.createElement("button");
        botonEditar.className = "btn btn-sm btn-outline-primary me-1";
        botonEditar.textContent = "Editar";
        botonEditar.addEventListener("click", function () {
            abrirModalEdicion(mascota);
        });

        const botonEliminar = document.createElement("button");
        botonEliminar.className = "btn btn-sm btn-outline-danger";
        botonEliminar.textContent = "Eliminar";
        botonEliminar.addEventListener("click", function () {
            eliminar(mascota);
        });

        celdaAcciones.appendChild(botonEditar);
        celdaAcciones.appendChild(botonEliminar);
        fila.appendChild(celdaAcciones);

        document.getElementById("cuerpoTabla").appendChild(fila);
    }

    function agregarCelda(fila, valor) {
        const celda = document.createElement("td");
        if (valor === null || valor === undefined) {
            celda.textContent = "";
        } else {
            celda.textContent = valor;
        }
        fila.appendChild(celda);
    }

    // --------------------------------------------------------------------------
    //  Formulario
    // --------------------------------------------------------------------------
    function abrirModalAlta() {
        idEnEdicion = null;
        document.getElementById("tituloModal").textContent = "Nueva mascota";
        document.getElementById("formulario").reset();
        document.getElementById("duenioId").disabled = false;
        ocultarError();
        modal.show();
    }

    function abrirModalEdicion(mascota) {
        idEnEdicion = mascota.id;
        document.getElementById("tituloModal").textContent = "Editar mascota #" + mascota.id;
        document.getElementById("nombre").value = mascota.nombre;
        document.getElementById("especie").value = mascota.especie;
        document.getElementById("raza").value = mascota.raza === null ? "" : mascota.raza;
        document.getElementById("fechaNacimiento").value = mascota.fechaNacimiento === null ? "" : mascota.fechaNacimiento;
        document.getElementById("duenioId").value = mascota.duenioId;
        // El dueño no se puede cambiar, pero igual se envía porque el DTO lo valida
        document.getElementById("duenioId").disabled = true;
        ocultarError();
        modal.show();
    }

    function leerFormulario() {
        const raza = document.getElementById("raza").value.trim();
        const fechaNacimiento = document.getElementById("fechaNacimiento").value;
        const duenioId = document.getElementById("duenioId").value;
        return {
            nombre: document.getElementById("nombre").value.trim(),
            especie: document.getElementById("especie").value.trim(),
            // Los campos opcionales vacíos se mandan como null
            raza: raza === "" ? null : raza,
            fechaNacimiento: fechaNacimiento === "" ? null : fechaNacimiento,
            // Un campo numérico vacío se manda como null, no como texto vacío
            duenioId: duenioId === "" ? null : parseInt(duenioId, 10)
        };
    }

    async function guardar(evento) {
        evento.preventDefault();
        ocultarError();

        const datos = leerFormulario();
        // Alta y edición cambian solo en el método HTTP y en la URL
        const esEdicion = idEnEdicion !== null;
        const url = esEdicion ? URL_API + "/" + idEnEdicion : URL_API;
        const metodo = esEdicion ? "PUT" : "POST";

        try {
            await pedir(url, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            modal.hide();
            mostrarAviso(esEdicion ? "Mascota actualizada correctamente." : "Mascota creada correctamente.", "success");
            await cargarTabla();
        } catch (error) {
            // El error se muestra DENTRO del modal, sin cerrarlo, así no se pierde lo escrito
            mostrarError(error.message);
        }
    }

    async function eliminar(mascota) {
        const confirmado = window.confirm(
            "¿Eliminar a la mascota " + mascota.nombre + "?\n\n" +
            "Si tiene turnos registrados, la operación se rechaza.");
        if (!confirmado) {
            return;
        }
        try {
            await pedir(URL_API + "/" + mascota.id, { method: "DELETE" });
            mostrarAviso("Mascota eliminada correctamente.", "success");
            await cargarTabla();
        } catch (error) {
            mostrarAviso(error.message);
        }
    }

    async function cargarDuenios() {
        const selectDuenios = document.getElementById("duenioId");
        selectDuenios.innerHTML = "";

        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Elegí un dueño...";
        selectDuenios.appendChild(opcionInicial);

        try {
            const duenios = await pedir(URL_DUENIOS);
            for (const duenio of duenios) {
                const opcion = document.createElement("option");
                opcion.value = duenio.id;
                opcion.textContent = duenio.nombre + " " + duenio.apellido + " (cédula " + duenio.cedula + ")";
                selectDuenios.appendChild(opcion);
            }
        } catch (error) {
            mostrarAviso(error.message);
        }
    }

    // --------------------------------------------------------------------------
    //  Mensajes en pantalla
    // --------------------------------------------------------------------------
    function mostrarError(mensaje) {
        const cartel = document.getElementById("errorFormulario");
        cartel.textContent = mensaje;
        cartel.classList.remove("d-none");
    }

    function ocultarError() {
        document.getElementById("errorFormulario").classList.add("d-none");
    }

    function mostrarAviso(mensaje, tipo) {
        const cartel = document.getElementById("aviso");
        cartel.textContent = mensaje;
        cartel.className = "alert alert-" + (tipo === "success" ? "success" : "danger");
    }

    function mostrarSinDatos(vacia) {
        const cartel = document.getElementById("sinDatos");
        if (vacia) {
            cartel.classList.remove("d-none");
        } else {
            cartel.classList.add("d-none");
        }
    }

    // --------------------------------------------------------------------------
    //  Arranque: se ejecuta cuando el HTML terminó de cargar
    // --------------------------------------------------------------------------
    async function iniciar() {
        modal = new bootstrap.Modal(document.getElementById("modalFormulario"));
        document.getElementById("botonNuevo").addEventListener("click", abrirModalAlta);
        document.getElementById("formulario").addEventListener("submit", guardar);
        await cargarTabla();
        await cargarDuenios();
    }

    document.addEventListener("DOMContentLoaded", iniciar);
</script>
</body>
</html>
