<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dueños · Clínica Veterinaria "Patitas Felices"</title>
    <!-- Bootstrap 5 por CDN: no se instala nada con npm.
         integrity = huella del archivo: si el CDN sirviera un archivo distinto, el
         navegador lo descarta en lugar de ejecutarlo. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<!-- ===== Barra de navegación (igual en las cuatro páginas) ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🐾 Clínica Veterinaria "Patitas Felices"</span>
        <div class="navbar-nav">
            <a class="nav-link active" href="index.html">Dueños</a>
            <a class="nav-link" href="mascotas.html">Mascotas</a>
            <a class="nav-link" href="veterinarios.html">Veterinarios</a>
            <a class="nav-link" href="turnos.html">Turnos</a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Dueños registrados</h2>
        <button class="btn btn-primary" id="botonNuevo">+ Nuevo dueño</button>
    </div>

    <!-- Avisos de la página: acá se muestran los errores que no vienen del formulario
         (por ejemplo, un error al eliminar, que ocurre con el modal cerrado) -->
    <div id="aviso" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover bg-white">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <p id="sinDatos" class="text-muted d-none">Todavía no hay dueños registrados.</p>

</div>

<!-- ===== Modal de alta / edición (el mismo formulario sirve para las dos cosas) ===== -->
<div class="modal fade" id="modalFormulario" tabindex="-1">
    <div class="modal-dialog">
        <!-- novalidate: desactiva la validación del navegador para que se vean los
             mensajes de error que devuelve la API (así se prueba el backend de verdad) -->
        <form class="modal-content" id="formulario" novalidate>
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Nuevo dueño</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="errorFormulario" class="alert alert-danger d-none"></div>

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="apellido">Apellido</label>
                    <input class="form-control" id="apellido" type="text">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="cedula">Cédula</label>
                    <input class="form-control" id="cedula" type="text" maxlength="8">
                    <!-- En edición este campo se bloquea: la cédula es el identificador
                         de negocio y el backend no la actualiza -->
                    <div class="form-text" id="ayudaCedula">Entre 7 y 8 dígitos.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="telefono">Teléfono</label>
                    <input class="form-control" id="telefono" type="number" max="2147483647">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="text">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script>
    // ==========================================================================
    //  Dueños — consumo de la API REST con fetch
    //  La API corre en el puerto 8080 y esta página en el 5500: son orígenes
    //  distintos, así que el navegador exige el permiso CORS que da CorsConfig.
    // ==========================================================================
    const URL_API = "http://localhost:8080/api/duenios";

    // Guarda el id del dueño que se está editando. Si vale null, el formulario es un alta.
    let idEnEdicion = null;
    let modal = null;

    // --------------------------------------------------------------------------
    //  Único lugar donde se llama a la API. Devuelve el JSON ya parseado y, si la
    //  respuesta es un error, lanza una excepción con el mensaje que manda el backend.
    // --------------------------------------------------------------------------
    async function pedir(url, opciones) {
        let respuesta;
        try {
            respuesta = await fetch(url, opciones);
        } catch (error) {
            // Acá cae la falta de conexión y el bloqueo por CORS
            throw new Error("No se pudo conectar con la API. ¿Está corriendo en el puerto 8080?");
        }

        // El 204 (No Content) del DELETE no trae cuerpo: no se puede leer como JSON
        if (respuesta.status === 204) {
            return null;
        }

        let cuerpo = null;
        try {
            cuerpo = await respuesta.json();
        } catch (error) {
            cuerpo = null;
        }

        if (!respuesta.ok) {
            // El backend responde siempre un ErrorResponse, y su campo se llama "mensaje"
            if (cuerpo !== null && cuerpo.mensaje) {
                throw new Error(cuerpo.mensaje);
            }
            throw new Error("El servidor respondió con el estado " + respuesta.status);
        }
        return cuerpo;
    }

    // --------------------------------------------------------------------------
    //  Tabla
    // --------------------------------------------------------------------------
    async function cargarTabla() {
        const cuerpoTabla = document.getElementById("cuerpoTabla");
        cuerpoTabla.innerHTML = "";
        try {
            const duenios = await pedir(URL_API);
            for (const duenio of duenios) {
                agregarFila(duenio);
            }
            mostrarSinDatos(duenios.length === 0);
        } catch (error) {
            mostrarAviso(error.message);
        }
    }

    function agregarFila(duenio) {
        const fila = document.createElement("tr");

        // textContent (en vez de innerHTML) evita que un dato con < o > rompa la página
        agregarCelda(fila, duenio.id);
        agregarCelda(fila, duenio.nombre);
        agregarCelda(fila, duenio.apellido);
        agregarCelda(fila, duenio.cedula);
        agregarCelda(fila, duenio.telefono);
        agregarCelda(fila, duenio.email);

        const celdaAcciones = document.createElement("td");
        celdaAcciones.className = "text-end";

        const botonEditar = document.createElement("button");
        botonEditar.className = "btn btn-sm btn-outline-primary me-1";
        botonEditar.textContent = "Editar";
        botonEditar.addEventListener("click", function () {
            abrirModalEdicion(duenio);
        });

        const botonEliminar = document.createElement("button");
        botonEliminar.className = "btn btn-sm btn-outline-danger";
        botonEliminar.textContent = "Eliminar";
        botonEliminar.addEventListener("click", function () {
            eliminar(duenio);
        });

        celdaAcciones.appendChild(botonEditar);
        celdaAcciones.appendChild(botonEliminar);
        fila.appendChild(celdaAcciones);

        document.getElementById("cuerpoTabla").appendChild(fila);
    }

    function agregarCelda(fila, valor) {
        const celda = document.createElement("td");
        if (valor === null || valor === undefined) {
            celda.textContent = "";
        } else {
            celda.textContent = valor;
        }
        fila.appendChild(celda);
    }

    // --------------------------------------------------------------------------
    //  Formulario
    // --------------------------------------------------------------------------
    function abrirModalAlta() {
        idEnEdicion = null;
        document.getElementById("tituloModal").textContent = "Nuevo dueño";
        document.getElementById("formulario").reset();
        document.getElementById("cedula").readOnly = false;
        ocultarError();
        modal.show();
    }

    function abrirModalEdicion(duenio) {
        idEnEdicion = duenio.id;
        document.getElementById("tituloModal").textContent = "Editar dueño #" + duenio.id;
        document.getElementById("nombre").value = duenio.nombre;
        document.getElementById("apellido").value = duenio.apellido;
        document.getElementById("cedula").value = duenio.cedula;
        document.getElementById("telefono").value = duenio.telefono;
        document.getElementById("email").value = duenio.email;
        // La cédula no se puede cambiar, pero igual se envía porque el DTO la valida
        document.getElementById("cedula").readOnly = true;
        ocultarError();
        modal.show();
    }

    function leerFormulario() {
        const telefono = document.getElementById("telefono").value;
        return {
            nombre: document.getElementById("nombre").value.trim(),
            apellido: document.getElementById("apellido").value.trim(),
            cedula: document.getElementById("cedula").value.trim(),
            // Un campo numérico vacío se manda como null, no como texto vacío
            telefono: telefono === "" ? null : parseInt(telefono, 10),
            email: document.getElementById("email").value.trim()
        };
    }

    async function guardar(evento) {
        evento.preventDefault();
        ocultarError();

        const datos = leerFormulario();
        // Alta y edición cambian solo en el método HTTP y en la URL
        const esEdicion = idEnEdicion !== null;
        const url = esEdicion ? URL_API + "/" + idEnEdicion : URL_API;
        const metodo = esEdicion ? "PUT" : "POST";

        try {
            await pedir(url, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            modal.hide();
            mostrarAviso(esEdicion ? "Dueño actualizado correctamente." : "Dueño creado correctamente.", "success");
            await cargarTabla();
        } catch (error) {
            // El error se muestra DENTRO del modal, sin cerrarlo, así no se pierde lo escrito
            mostrarError(error.message);
        }
    }

    async function eliminar(duenio) {
        const confirmado = window.confirm(
            "¿Eliminar al dueño " + duenio.nombre + " " + duenio.apellido + "?\n\n" +
            "Se borran también sus mascotas. Si alguna tiene turnos registrados, " +
            "la operación se rechaza.");
        if (!confirmado) {
            return;
        }
        try {
            await pedir(URL_API + "/" + duenio.id, { method: "DELETE" });
            mostrarAviso("Dueño eliminado correctamente.", "success");
            await cargarTabla();
        } catch (error) {
            mostrarAviso(error.message);
        }
    }

    // --------------------------------------------------------------------------
    //  Mensajes en pantalla
    // --------------------------------------------------------------------------
    function mostrarError(mensaje) {
        const cartel = document.getElementById("errorFormulario");
        cartel.textContent = mensaje;
        cartel.classList.remove("d-none");
    }

    function ocultarError() {
        document.getElementById("errorFormulario").classList.add("d-none");
    }

    function mostrarAviso(mensaje, tipo) {
        const cartel = document.getElementById("aviso");
        cartel.textContent = mensaje;
        cartel.className = "alert alert-" + (tipo === "success" ? "success" : "danger");
    }

    function mostrarSinDatos(vacia) {
        const cartel = document.getElementById("sinDatos");
        if (vacia) {
            cartel.classList.remove("d-none");
        } else {
            cartel.classList.add("d-none");
        }
    }

    // --------------------------------------------------------------------------
    //  Arranque: se ejecuta cuando el HTML terminó de cargar
    // --------------------------------------------------------------------------
    function iniciar() {
        modal = new bootstrap.Modal(document.getElementById("modalFormulario"));
        document.getElementById("botonNuevo").addEventListener("click", abrirModalAlta);
        document.getElementById("formulario").addEventListener("submit", guardar);
        cargarTabla();
    }

    document.addEventListener("DOMContentLoaded", iniciar);
</script>
</body>
</html>
