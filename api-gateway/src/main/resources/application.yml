server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # cors: permite que un frontend de otro dominio llame al gateway (el * es solo para desarrollo)
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders: "*"
                allowCredentials: false
          discovery:
            locator:
              # tambien crea rutas automaticas con el nombre de cada servicio en eureka
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ms-duenio
              uri: lb://ms-duenio
              predicates:
                - Path=/api/duenios/**
            - id: ms-mascota
              uri: lb://ms-mascota
              predicates:
                - Path=/api/mascotas/**
            - id: ms-veterinario
              uri: lb://ms-veterinario
              predicates:
                - Path=/api/veterinarios/**
            - id: ms-turno
              uri: lb://ms-turno
              predicates:
                - Path=/api/turnos/**
            # version publica de la api: /v1/duenios/... se reescribe a /api/duenios/... antes de mandarlo a ms-duenio
            - id: ms-duenio-v1
              uri: lb://ms-duenio
              predicates:
                - Path=/v1/duenios/**
              filters:
                - RewritePath=/v1/duenios(?<segment>/?.*), /api/duenios${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
