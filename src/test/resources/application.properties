# Configuracion SOLO de tests.
#
# Spring resuelve classpath:/application.properties (singular) y toma el PRIMERO
# del classpath. Surefire pone target/test-classes antes que target/classes, asi
# que este archivo REEMPLAZA entero al de src/main/resources (no se fusionan).
# Por eso tiene que ser autocontenido: si faltara la url, quedaria la de MySQL.
spring.application.name=vet-system

# H2 en memoria: ningun test toca la base de desarrollo ni necesita start-mysql.cmd.
spring.datasource.url=jdbc:h2:mem:vetsystem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate arma el esquema desde las entidades y lo tira al cerrar el contexto.
# El dialecto NO se fija a mano: Hibernate detecta H2Dialect por los metadatos JDBC.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
